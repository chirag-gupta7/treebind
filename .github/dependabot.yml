version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # The Kubernetes libraries and controller-runtime move together, so they
    # arrive as one pull request. Review it by running the envtest and e2e
    # suites, not by reading the diff.
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    labels: ["dependencies", "area/packaging"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area/ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area/ci"]
